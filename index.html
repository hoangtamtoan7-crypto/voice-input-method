<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>语音输入法 - Voice Input</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-container">
    <!-- 头部 -->
    <header class="app-header">
      <h1 class="app-title">语音输入法</h1>
      <button class="btn-icon theme-toggle" id="themeToggle" title="切换主题" aria-label="切换深色/浅色主题">
        <svg class="icon icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        <svg class="icon icon-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </header>

    <!-- 主内容区 -->
    <main class="app-main">
      <!-- 录音按钮区域 -->
      <section class="record-section">
        <div class="status-indicator" id="statusIndicator">
          <span class="status-dot"></span>
          <span class="status-text" id="statusText">就绪</span>
        </div>
        <button class="record-btn" id="recordBtn" aria-label="开始录音">
          <svg class="mic-icon" viewBox="0 0 24 24">
            <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
            <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
          </svg>
        </button>
        <p class="record-hint" id="recordHint">点击麦克风开始录音</p>
      </section>

      <!-- 控制栏 -->
      <section class="controls-bar">
        <div class="lang-selector">
          <label for="langSelect" class="sr-only">选择语言</label>
          <select id="langSelect" class="lang-select">
            <option value="zh-CN">中文（普通话）</option>
            <option value="cmn-Hans-CN">中文（普通话-简化字）</option>
            <option value="yue-Hant-HK">粤语（香港）</option>
            <option value="en-US">English (US)</option>
            <option value="ja-JP">日本語</option>
            <option value="ko-KR">한국어</option>
          </select>
        </div>
        <div class="action-buttons">
          <button class="btn btn-secondary" id="copyBtn" disabled title="复制全部文本">
            <svg class="btn-icon-svg" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            复制
          </button>
          <button class="btn btn-secondary" id="clearBtn" disabled title="清空文本">
            <svg class="btn-icon-svg" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
            清空
          </button>
          <button class="btn btn-secondary" id="exportBtn" disabled title="导出为TXT文件">
            <svg class="btn-icon-svg" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            导出
          </button>
        </div>
      </section>

      <!-- 文本显示区域 -->
      <section class="text-section">
        <div class="text-area-wrapper">
          <textarea
            id="textOutput"
            class="text-output"
            placeholder="语音识别结果将显示在这里..."
            readonly
            aria-label="语音识别结果"
          ></textarea>
          <div class="text-charcount" id="charCount">0 字</div>
        </div>
      </section>

      <!-- 历史记录 -->
      <section class="history-section">
        <details class="history-details">
          <summary class="history-summary">
            <svg class="btn-icon-svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            历史记录
          </summary>
          <ul class="history-list" id="historyList">
            <li class="history-empty">暂无历史记录</li>
          </ul>
        </details>
      </section>
    </main>

    <!-- 页脚 -->
    <footer class="app-footer">
      <p>基于 Web Speech API 构建 | 七牛云 XEngineer 实训营</p>
    </footer>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
